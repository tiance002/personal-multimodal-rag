[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-rag"
version = "0.1.0"
description = "Personal local-first multimodal RAG knowledge agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.5",
  "uvicorn==0.35.0",
  "sqlalchemy==2.0.52",
  "alembic==1.16.5",
  "psycopg[binary]==3.2.10",
  "pgvector==0.4.1",
  "PyMuPDF==1.26.4",
  "Pillow==12.3.0",
  "python-multipart==0.0.20",
  "langchain==1.4.2",
  "langchain-ollama==1.1.0",
  "langfuse==4.15.6",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "httpx==0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["backend*"]
