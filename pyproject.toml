[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-rag"
version = "0.1.0"
description = "Personal local-first multimodal RAG knowledge agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "PyYAML==6.0.3",
  "httpx==0.28.1",
  "idna==3.20",
  "httpcore==1.0.9",
  "cryptography==46.0.3",
  "pydantic==2.13.5",
  "uvicorn==0.35.0",
  "sqlalchemy==2.0.52",
  "alembic==1.16.5",
  "psycopg[binary]==3.2.10",
  "redis==5.2.1",
  "pgvector==0.4.1",
  "PyMuPDF==1.26.4",
  "openpyxl==3.1.5",
  "et-xmlfile==2.0.0",
  "defusedxml==0.7.1",
  "python-docx==1.2.0",
  "beautifulsoup4==4.14.3",
  "xlrd==2.0.2",
  "lxml==6.1.3",
  "soupsieve==2.10",
  "Pillow==12.3.0",
  "python-multipart==0.0.20",
  "langchain==1.4.2",
  "langchain-ollama==1.1.0",
  "langfuse==4.15.6",
  "tokenizers==0.23.2",
]

[project.scripts]
weknora-python-api = "backend.weknora_port.entrypoint:main"
weknora-python-worker = "backend.weknora_port.worker:main"
weknora-python-init = "backend.weknora_port.initialize:main"

[project.optional-dependencies]
weknora-port = [
  "tiktoken==0.14.0",
  "httpx==0.28.1",
  "idna==3.20",
  "httpcore==1.0.9",
  "pypdfium2==5.8.0",
  "markitdown[docx,pptx,xlsx]==0.1.3",
  "python-pptx==1.0.2",
  "pandas==2.3.3",
  "numpy==2.3.4",
  "cryptography==46.0.3",
  "cffi==2.1.1",
  "pycparser==3.11",
]
service = [
  "sentencepiece==0.2.1",
  "Jinja2==3.1.6",
  "MarkupSafe==3.0.3",
  "deepseek-recipe==0.1.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
eval = [
  "tiktoken==0.14.0",
]
dev = [
  "pytest==9.1.1",
  "httpx==0.28.1",
  "idna==3.20",
]

[tool.pytest.ini_options]
testpaths = ["tests/weknora_port"]
pythonpath = ["."]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["backend", "backend.weknora_port*", "backend.app.domain", "eval_center*"]
exclude = ["backend.tests*"]

[tool.setuptools.package-data]
"backend.weknora_port" = ["profile_assets/*.yaml", "profile_assets/*.json", "conversation_assets/*.yaml", "conversation_assets/*.json"]
"backend.weknora_port.storage" = ["migrations/*.sql", "migrations/*.json"]
"backend.weknora_port.retrieval" = ["tokenizer_assets/*", "NOTICE"]
"backend.weknora_port.ingestion" = ["NOTICE", "*.txt", "LICENSE*", "html_codec_sources/*.go", "html_codec_sources/go.mod", "html_codec_sources/go.sum"]
"backend.weknora_port.models" = ["NOTICE", "catalog_resources/*.json"]
"backend.weknora_port.conversation" = ["NOTICE"]
