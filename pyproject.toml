[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "weknora-python-learning-snapshot"
version = "0.1.0"
description = "Selected fixed-source Python/FastAPI and React RAG learning snapshot"
requires-python = ">=3.11"
dependencies = [
 "fastapi==0.141.1", "pydantic==2.13.5", "uvicorn==0.35.0",
 "psycopg[binary]==3.2.10", "redis==5.2.1", "pgvector==0.4.1",
 "httpx==0.28.1", "httpcore==1.0.9", "cryptography==46.0.3",
 "PyMuPDF==1.26.4", "Pillow==12.3.0", "python-multipart==0.0.20",
 "python-docx==1.2.0", "openpyxl==3.1.5", "xlrd==2.0.2",
 "defusedxml==0.7.1", "lxml==6.1.3", "beautifulsoup4==4.14.3",
 "tiktoken==0.14.0"
]

[project.optional-dependencies]
parsers = ["pypdfium2==5.8.0", "markitdown[docx,pptx,xlsx]==0.1.3", "python-pptx==1.0.2", "pandas==2.3.3", "numpy==2.3.4"]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests/weknora_port"]
pythonpath = ["."]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["backend", "backend.weknora_port*"]

[tool.setuptools.package-data]
"backend.weknora_port" = ["profile_assets/*.yaml", "profile_assets/*.json"]
"backend.weknora_port.storage" = ["migrations/*.sql", "migrations/*.json"]
"backend.weknora_port.retrieval" = ["tokenizer_assets/*", "NOTICE"]
"backend.weknora_port.ingestion" = ["NOTICE", "*.txt", "LICENSE*", "html_codec_sources/*"]
"backend.weknora_port.models" = ["NOTICE", "catalog_resources/*.json"]
"backend.weknora_port.conversation" = ["NOTICE"]
