# Explicit new data services only, for owner-approved shadow setup before identity inspection.
name: weknora-python-dev
services:
  db:
    image: paradedb/paradedb:v0.22.6-pg17
    environment:
      POSTGRES_DB: weknora_python_dev
      POSTGRES_USER: weknora
      POSTGRES_PASSWORD: ${WEKNORA_PORT_DB_PASSWORD:?explicit new development password required}
    volumes: [weknora-python-dev-db:/var/lib/postgresql/data]
  redis:
    image: redis:7.4.2
    command: [redis-server, --appendonly, 'yes']
    volumes: [weknora-python-dev-redis:/data]
volumes:
  weknora-python-dev-db:
  weknora-python-dev-redis:
