# Development candidate only. Never applies changes to previously running projects.
name: weknora-python-dev
x-runtime: &runtime
  WEKNORA_PORT_DATABASE_URL: postgresql://weknora:${WEKNORA_PORT_DB_PASSWORD:?explicit new development password required}@db:5432/weknora_python_dev
  WEKNORA_PORT_DATABASE_NAME: weknora_python_dev
  WEKNORA_PORT_DATABASE_SYSTEM_ID: ${WEKNORA_PORT_DATABASE_SYSTEM_ID:?inspect the new instance first}
  WEKNORA_PORT_REDIS_URL: redis://redis:6379/15
  WEKNORA_PORT_REDIS_RUN_ID: ${WEKNORA_PORT_REDIS_RUN_ID:?inspect the new instance first}
  WEKNORA_PORT_REDIS_PREFIX: weknora-python-dev:runtime
  WEKNORA_PORT_STORAGE_ROOT: /data/weknora-python
  WEKNORA_PORT_SECRET_KEY_FILE: /run/secrets/weknora_python_key
  WEKNORA_PORT_TOKENIZER_ASSET: /opt/assets/cl100k_base.tiktoken
  WEKNORA_PORT_ROUTER_MODE: DYNAMIC
  WEKNORA_PORT_ORIGINS: http://127.0.0.1:${WEKNORA_PORT_FRONTEND_PORT:-14173},http://localhost:${WEKNORA_PORT_FRONTEND_PORT:-14173}
services:
  db:
    image: paradedb/paradedb:v0.22.6-pg17
    environment:
      POSTGRES_DB: weknora_python_dev
      POSTGRES_USER: weknora
      POSTGRES_PASSWORD: ${WEKNORA_PORT_DB_PASSWORD:?explicit new development password required}
    volumes: [weknora-python-dev-db:/var/lib/postgresql/data]
  redis:
    image: redis:7.4.2
    command: [redis-server, --appendonly, 'yes']
    volumes: [weknora-python-dev-redis:/data]
  api:
    build: {context: .., dockerfile: deploy/Dockerfile.api}
    environment: *runtime
    ports: ['127.0.0.1:${WEKNORA_PORT_API_PORT:-18000}:8000']
    volumes:
      - weknora-python-dev-storage:/data/weknora-python
      - ${WEKNORA_PORT_KEY_FILE_HOST:?32-byte key file required}:/run/secrets/weknora_python_key:ro
      - ${WEKNORA_PORT_ASSETS_HOST:?local tokenizer assets directory required}:/opt/assets:ro
  worker:
    build: {context: .., dockerfile: deploy/Dockerfile.worker}
    environment: *runtime
    volumes:
      - weknora-python-dev-storage:/data/weknora-python
      - ${WEKNORA_PORT_KEY_FILE_HOST:?32-byte key file required}:/run/secrets/weknora_python_key:ro
      - ${WEKNORA_PORT_ASSETS_HOST:?local tokenizer assets directory required}:/opt/assets:ro
  frontend:
    build: {context: .., dockerfile: deploy/Dockerfile.frontend}
    ports: ['127.0.0.1:${WEKNORA_PORT_FRONTEND_PORT:-14173}:80']
volumes:
  weknora-python-dev-db:
  weknora-python-dev-redis:
  weknora-python-dev-storage:
