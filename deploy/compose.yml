services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag}
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - rag-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      RAG_DATABASE_URL: postgresql+psycopg://rag:rag@db:5432/rag
      RAG_STORAGE_ROOT: /data/storage
      RAG_CLOUD_ENABLED: ${RAG_CLOUD_ENABLED:-false}
      RAG_LANGFUSE_ENABLED: ${RAG_LANGFUSE_ENABLED:-false}
      RAG_LANGFUSE_CAPTURE_CONTENT: ${RAG_LANGFUSE_CAPTURE_CONTENT:-false}
      RAG_INLINE_INGESTION: "false"
      OLLAMA_BASE_URL: ${COMPOSE_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3.5:4b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-bge-m3:latest}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://us.cloud.langfuse.com}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_AUTHORIZATION: ${LANGFUSE_AUTHORIZATION:-}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - rag-storage:/data/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    environment:
      RAG_DATABASE_URL: postgresql+psycopg://rag:rag@db:5432/rag
      RAG_STORAGE_ROOT: /data/storage
      RAG_CLOUD_ENABLED: "false"
      RAG_TESSDATA_DIR: /opt/tessdata
      OLLAMA_BASE_URL: ${COMPOSE_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3.5:4b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-bge-m3:latest}
    volumes:
      - rag-storage:/data/storage
      - ../var/tessdata:/opt/tessdata:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4173}:80"
    depends_on:
      - api

volumes:
  rag-db:
  rag-storage:
